<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Runway — CLB IT</title>
<link rel="icon" href="assets/logo/logo-runway-icon.png">
<style>
  /* Màu lấy từ BRAND.md — sửa cho đúng bộ nhận diện */
  :root {
    --brand-primary: #4285f4;
    --text: #111111;
    --bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --text: #f5f5f5; --bg: #0f0f0f; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  img { max-width: 220px; height: auto; }
  code {
    background: color-mix(in srgb, var(--text) 12%, transparent);
    padding: 2px 6px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <main>
    <!-- Đổi sang đúng tên file logo trong assets/logo/ -->
    <img src="assets/logo/logo-runway-horizontal.png" alt="Logo Runway">
    <h1>Bắt đầu từ đây</h1>
    <p>Đọc <code>BRAND.md</code> và <code>CONTENT.md</code> trước khi làm.</p>
    <p>Xóa hết file này và làm trang của riêng bạn.</p>
  </main>
</body>
</html>
